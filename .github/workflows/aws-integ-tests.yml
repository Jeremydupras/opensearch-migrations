      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release-canary }}
      commit: ${{ needs.resolve-ref.outputs.commit }}
      scripts-ref: ${{ needs.resolve-ref.outputs.scripts_ref }}
      setup-env: true
      run: '"$CI_AWS"/solutions-cfn-test.sh'
      cleanup: '"$CI_AWS"/eks-cleanup.sh'
      run-timeout-minutes: 120
      timeout-minutes: 210
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}
