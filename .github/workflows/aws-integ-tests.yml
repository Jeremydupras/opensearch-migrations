---
# AWS integration tests, run from GitHub Actions through the OIDC roles in the CI test account (replaces the AWS jobs
# in jenkins_tests.yml). Each test is a script under ci/aws/ run by aws-ci-job.yml; its teardown always runs, and every
# run deploys into its own stage.
#   Scheduled runs (twice a day, the "all" set) and manual runs use osm-ci-main. "all" runs every test Jenkins ran
#   periodically.
#   Release canary: test the latest x.y.z release tag, with the ci/aws scripts from this run's ref.
#   PRs: a maintainer adds the test's run-* label, then approves the run in migrations-ci-pr; uses osm-ci-pr.
#        rfs-default, solutions-cfn-create-vpc and the AOSS time-series/vector tests have no PR trigger, as on Jenkins.
name: AWS integ tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        type: choice
        options:
          - all
          - eks-integ
          - eks-cfn-create-vpc
          - eks-cfn-import-vpc
          - eks-cdc-full-e2e
          - eks-cdc-aoss-e2e
          - eks-cdc-k6-load
          - eks-aoss-search
          - eks-aoss-timeseries
          - eks-aoss-vector
          - eks-byos
          - eks-isolated
          - full-es68
          - rfs-default
          - solutions-cfn-create-vpc
        default: eks-integ
      release-canary:
        description: 'Test the latest release tag instead of this branch'
        type: boolean
        default: false
  pull_request_target:
    types: [labeled, synchronize, reopened]
  schedule:
    # Twice a day on main: every test in "all". Off the hour, as GitHub delays runs at the top of the hour.
    - cron: '17 6,18 * * *'

permissions:
  contents: read

jobs:
  sanitize-input:
    uses: ./.github/workflows/sanitize-repo-details.yml

  resolve-ref:
    needs: sanitize-input
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.ref.outputs.commit }}
      scripts_ref: ${{ steps.ref.outputs.scripts_ref }}
    steps:
      - id: ref
        env:
          CANARY: ${{ github.event_name == 'workflow_dispatch' && inputs.release-canary }}
          COMMIT: ${{ needs.sanitize-input.outputs.commit_hash }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [[ "$CANARY" == true ]]; then
            tag=$(git ls-remote --tags "$REPO_URL" | { grep -oE 'refs/tags/[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's|refs/tags/||' | sort -V | tail -1)
            [[ -n "$tag" ]] || { echo "::error::No x.y.z release tag found"; exit 1; }
            echo "Release canary: testing $tag with the ci/aws scripts from $GITHUB_SHA"
            echo "commit=refs/tags/$tag" >> "$GITHUB_OUTPUT"
            echo "scripts_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "scripts_ref=" >> "$GITHUB_OUTPUT"
          fi

  eks-integ-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-integ-test:
    needs: [resolve-ref, eks-integ-gate]
    if: |
      always() && needs.resolve-ref.result == 'success' && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-integ' || inputs.test == 'all')) ||
        needs.eks-integ-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-integ-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release-canary }}
      commit: ${{ needs.resolve-ref.outputs.commit }}
      scripts-ref: ${{ needs.resolve-ref.outputs.scripts_ref }}
      setup-env: true
      run: '"$CI_AWS"/eks-integ-test.sh --source-version ES_7.10 --target-version OS_1.3 --test-ids 0001,0002'
      cleanup: '"$CI_AWS"/eks-cleanup.sh'
      run-timeout-minutes: 210
      timeout-minutes: 300
      artifact-path: libraries/testAutomation/logs
      artifact-name: eks-integ-logs
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cfn-create-vpc-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
