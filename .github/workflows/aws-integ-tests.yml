---
# AWS integration tests, run from GitHub Actions through the OIDC roles in the CI test account (replaces the AWS jobs
# in jenkins_tests.yml). Each test is a script under ci/aws/ that runs inside aws-ci-job.yml; its teardown always runs.
#   main: manual runs (and, later, a schedule) use osm-ci-main.
#   PRs:  a maintainer adds the test's run-* label, then approves the run in migrations-ci-pr; uses osm-ci-pr.
name: AWS integ tests

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Test to run'
        type: choice
        options:
          - all
          - eks-integ
          - eks-cfn-create-vpc
          - eks-cfn-import-vpc
          - eks-cdc-full-e2e
          - eks-cdc-aoss-e2e
          - eks-cdc-k6-load
        default: eks-integ
  pull_request_target:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  sanitize-input:
    uses: ./.github/workflows/sanitize-repo-details.yml

  eks-integ-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-integ-test:
    needs: [sanitize-input, eks-integ-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-integ' || inputs.test == 'all')) ||
        needs.eks-integ-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-integ-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-integ-test.sh --source-version ES_7.10 --target-version OS_1.3 --test-ids 0001,0002
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 210
      timeout-minutes: 300
      artifact-path: libraries/testAutomation/logs
      artifact-name: eks-integ-logs
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cfn-create-vpc-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-cfn-tests

  eks-cfn-create-vpc-test:
    needs: [sanitize-input, eks-cfn-create-vpc-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-cfn-create-vpc' || inputs.test == 'all')) ||
        needs.eks-cfn-create-vpc-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cfn-create-vpc-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-cfn-test.sh
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 120
      timeout-minutes: 210
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cdc-full-e2e-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-cdc-full-e2e-test:
    needs: [sanitize-input, eks-cdc-full-e2e-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-cdc-full-e2e' || inputs.test == 'all')) ||
        needs.eks-cdc-full-e2e-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cdc-full-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-cdc-test.sh --test-ids 0031,0032,0033,0040,0042
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 270
      timeout-minutes: 355
      artifact-path: libraries/testAutomation/logs
      artifact-name: eks-cdc-full-e2e-logs
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cfn-import-vpc-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-cfn-tests

  eks-cfn-import-vpc-test:
    needs: [sanitize-input, eks-cfn-import-vpc-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-cfn-import-vpc' || inputs.test == 'all')) ||
        needs.eks-cfn-import-vpc-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cfn-import-vpc-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-cfn-test.sh --vpc-mode import
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 120
      timeout-minutes: 210
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cdc-aoss-e2e-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-cdc-aoss-e2e-test:
    needs: [sanitize-input, eks-cdc-aoss-e2e-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-cdc-aoss-e2e' || inputs.test == 'all')) ||
        needs.eks-cdc-aoss-e2e-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cdc-aoss-e2e-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-cdc-aoss-test.sh --test-ids 0034,0041
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 240
      timeout-minutes: 330
      artifact-path: libraries/testAutomation/logs
      artifact-name: eks-cdc-aoss-e2e-logs
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}

  eks-cdc-k6-load-gate:
    if: github.event_name == 'pull_request_target'
    uses: ./.github/workflows/aws-ci-pr-gate.yml
    permissions:
      issues: read
      pull-requests: read
    with:
      label: run-eks-tests

  eks-cdc-k6-load-test:
    needs: [sanitize-input, eks-cdc-k6-load-gate]
    if: |
      always() && needs.sanitize-input.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && (inputs.test == 'eks-cdc-k6-load' || inputs.test == 'all')) ||
        needs.eks-cdc-k6-load-gate.outputs.allowed == 'true')
    uses: ./.github/workflows/aws-ci-job.yml
    concurrency:
      group: aws-integ-eks-cdc-k6-load-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    with:
      pool: ${{ github.event_name == 'pull_request_target' && 'pr' || 'main' }}
      commit: ${{ needs.sanitize-input.outputs.commit_hash }}
      setup-env: true
      run: ./ci/aws/eks-cdc-test.sh --stage-base esosk6 --test-ids 0080
      cleanup: ./ci/aws/eks-cleanup.sh
      run-timeout-minutes: 270
      timeout-minutes: 355
      artifact-path: libraries/testAutomation/logs
      artifact-name: eks-cdc-k6-load-logs
    secrets:
      MIGRATIONS_CI_MAIN_ROLE: ${{ secrets.MIGRATIONS_CI_MAIN_ROLE }}
      MIGRATIONS_CI_PR_ROLE: ${{ secrets.MIGRATIONS_CI_PR_ROLE }}
